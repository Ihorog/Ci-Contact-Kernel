name: Ci Point Android

on:
  pull_request:
    paths:
      - 'android/ci-point/**'
      - 'tools/local-ai/**'
      - 'Cipole (2).png'
      - '.github/workflows/ci-point-android.yml'
      - '.github/scripts/ci-point-emulator-smoke.sh'
  push:
    branches: [main]
    paths:
      - 'android/ci-point/**'
      - 'tools/local-ai/**'
      - 'operator-node/ci_operator.py'
      - 'public/ci-registry/**'
      - '.github/workflows/ci-point-android.yml'
      - '.github/scripts/ci-point-emulator-smoke.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify context action runtime
        run: python3 -m unittest discover -s tools/local-ai -p 'test_*.py'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Static check local AI
        run: python3 -m py_compile tools/local-ai/*.py

      - name: Smoke local AI fallback runtime
        env:
          CI_OLLAMA_URL: http://127.0.0.1:1
          CI_LOCAL_AI_HOST: 127.0.0.1
          CI_LOCAL_AI_PORT: 8791
        run: |
          set -euo pipefail
          python3 tools/local-ai/ci_local_ai_server.py >/tmp/ci-local-ai.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json, time, urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8791/health", timeout=1) as r:
                      h=json.loads(r.read())
                  if h.get("ok"):
                      break
              except Exception:
                  time.sleep(.2)
          else:
              raise SystemExit("CI_LOCAL_AI_HEALTH_FAIL")
          data=json.dumps({"text":"ping","source":"ci-ci-smoke","platform":"android","device":"smoke","surface":"ci-point","locale":"uk-UA"}).encode()
          req=urllib.request.Request("http://127.0.0.1:8791/ci/intent",data=data,headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=2) as r:
              result=json.loads(r.read())
          assert result.get("ok") is True, result
          assert result.get("protocol") == "ci-context-action-v0.5", result
          print("CI_LOCAL_AI_INTENT=PASS", result.get("processor"))
          PY

      - name: Lint and build APK
        run: ./gradlew :app:lintDebug :app:assembleDebug --stacktrace
        working-directory: android/ci-point

      - name: Hash APK
        run: sha256sum android/ci-point/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke install and start on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/ci-point-emulator-smoke.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ci-point-debug-apk
          path: android/ci-point/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  deliver:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: ci-point-debug-apk
          path: delivery

      - name: Publish Ci Point v0.5.3
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ci-point-v0.5.3
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mv delivery/app-debug.apk delivery/Ci-Point-v0.5.3.apk
          sha256sum delivery/Ci-Point-v0.5.3.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace an immutable versioned APK."
            exit 0
          fi
          gh release create "$TAG" delivery/Ci-Point-v0.5.3.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Ci Point v0.5.3" \
            --notes "Verified Android build: lint/build green, Android 35 install/runtime smoke passed, resilient Orange endpoint routing enabled, and local Ci runtime smoke passed."
