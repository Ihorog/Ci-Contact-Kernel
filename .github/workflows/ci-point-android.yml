name: Ci Point Android

on:
  pull_request:
    paths:
      - 'android/ci-point/**'
      - 'tools/local-ai/**'
      - 'Cipole (2).png'
      - '.github/workflows/ci-point-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify context action runtime
        run: python3 -m unittest discover -s tools/local-ai -p 'test_*.py'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Static check local AI
        run: python3 -m py_compile tools/local-ai/*.py

      - name: Lint and build APK
        run: ./gradlew :app:lintDebug :app:assembleDebug --stacktrace
        working-directory: android/ci-point

      - name: Hash APK
        run: sha256sum android/ci-point/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke install and start on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            APK="android/ci-point/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb shell pm grant ua.cimeika.ci android.permission.RECORD_AUDIO
            adb shell pm grant ua.cimeika.ci android.permission.POST_NOTIFICATIONS || true
            adb shell appops set ua.cimeika.ci SYSTEM_ALERT_WINDOW allow
            adb logcat -c
            adb shell am start -W -n ua.cimeika.ci/ua.cimeika.cipoint.MainActivity
            sleep 5
            adb shell dumpsys package ua.cimeika.ci | grep -q 'versionName=0.5.1'
            adb shell dumpsys activity services ua.cimeika.ci | grep -q 'CiOverlayService'
            adb shell pidof ua.cimeika.ci
            if adb logcat -d -v brief | grep -E 'FATAL EXCEPTION|AndroidRuntime' | grep -q 'ua.cimeika.ci'; then
              echo "Ci-Point crash detected"
              exit 1
            fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ci-point-debug-apk
          path: android/ci-point/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
