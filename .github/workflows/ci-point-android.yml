name: Ci Point Android

on:
  pull_request:
    paths:
      - 'android/ci-point/**'
      - 'tools/local-ai/**'
      - 'Cipole (2).png'
      - '.github/workflows/ci-point-android.yml'
      - '.github/scripts/ci-point-emulator-smoke.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify context action runtime
        run: python3 -m unittest discover -s tools/local-ai -p 'test_*.py'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Static check local AI
        run: python3 -m py_compile tools/local-ai/*.py

      - name: Lint and build APK
        run: ./gradlew :app:lintDebug :app:assembleDebug --stacktrace
        working-directory: android/ci-point

      - name: Hash APK
        run: sha256sum android/ci-point/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke install and start on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/ci-point-emulator-smoke.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ci-point-debug-apk
          path: android/ci-point/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  deliver-p0:
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/point-p0-install-smoke'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-point-debug-apk
          path: delivery

      - name: Publish verified APK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ci-point-v0.5.1-p0
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mv delivery/app-debug.apk delivery/Ci-Point-v0.5.1-P0.apk
          sha256sum delivery/Ci-Point-v0.5.1-P0.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" delivery/Ci-Point-v0.5.1-P0.apk --clobber
          else
            gh release create "$TAG" delivery/Ci-Point-v0.5.1-P0.apk               --repo "$GITHUB_REPOSITORY"               --target "$TARGET_SHA"               --title "Ci Point v0.5.1 P0"               --notes "Verified P0 APK: Android lint/build green and Android 35 emulator install/start/service smoke passed."               --prerelease
          fi
