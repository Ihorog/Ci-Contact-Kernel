name: Ci Point Android

on:
  pull_request:
    paths:
      - 'android/ci-point/**'
      - 'Cipole (2).png'
      - '.github/workflows/ci-point-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android/ci-point :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ci-point-debug-apk
          path: android/ci-point/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
