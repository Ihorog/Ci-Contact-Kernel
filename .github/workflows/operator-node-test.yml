name: operator-node-test

on:
  push:
    paths:
      - 'operator-node/**'
      - '.github/workflows/operator-node-test.yml'
  pull_request:
    paths:
      - 'operator-node/**'
      - '.github/workflows/operator-node-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile operator modules
        run: python -m py_compile ci_operator.py ci_operator_runtime.py provider_adapters.py install_orange.py install_provider_layer.py selftest.py mcp_probe.py
      - name: Run provider adapter tests
        run: python -m unittest -v test_provider_adapters.py
