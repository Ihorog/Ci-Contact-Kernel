name: operator-node-test

on:
  push:
    paths:
      - 'operator-node/**'
      - '.github/workflows/operator-node-test.yml'
  pull_request:
    paths:
      - 'operator-node/**'
      - '.github/workflows/operator-node-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile operator modules
        run: >-
          python -m py_compile
          ci_operator.py ci_operator_runtime.py provider_adapters.py operator_telemetry.py
          queue_contract.py release_manager.py self_update.py install_orange.py install_provider_layer.py selftest.py mcp_probe.py
          test_chatgpt_action_schema.py
      - name: Run operator safety tests
        run: >-
          python -m unittest -v
          test_provider_adapters.py test_self_update.py test_operator_telemetry.py test_queue_contract.py test_release_manager.py
          test_chatgpt_action_schema.py
