plugins {
    id 'com.android.application'
}

def ciOperatorBaseUrl =
        project.findProperty('CI_OPERATOR_BASE_URL') ?: 'http://192.168.1.54:8791'
def ciOperatorHealthUrl =
        project.findProperty('CI_OPERATOR_HEALTH_URL') ?:
                'https://mcp-http.cimeika.com.ua/operator/health'

def quoteBuildConfig = { value ->
    '"' + value.toString().replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'ua.cimeika.cipoint'
    compileSdk 35

    defaultConfig {
        applicationId 'ua.cimeika.ci'
        minSdk 26
        targetSdk 33
        versionCode 13
        versionName '0.5.4'

        buildConfigField 'String', 'CI_OPERATOR_BASE_URL',
                quoteBuildConfig(ciOperatorBaseUrl)
        buildConfigField 'String', 'CI_OPERATOR_HEALTH_URL',
                quoteBuildConfig(ciOperatorHealthUrl)
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false

            // Ci Point is not Play-distributed yet. Keep the hardened release
            // installable for device verification until a dedicated signing
            // identity is provisioned.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def ciBrandHashes = [
    'ci-logo-master-transparent.png': '107dd1b358ef947bd8dedbdf25230fbc13773189265ec37140e6ab7131aeef33',
    'ci-logo-monochrome-white.png': 'e5ee21ba129f6907413a2db4d852cece918f1fb516e473c5493e2c08838540d1',
    'ci-icon-512.png': '24b43847f4184d83b6a465ed6e4be48e03980930c5ca1a1fff5e889b4677c17d'
]

tasks.register('verifyCiBrandAssets') {
    doLast {
        ciBrandHashes.each { name, expected ->
            def file = rootProject.file("brand/${name}")
            if (!file.exists()) throw new GradleException("Missing Ci brand asset: ${name}")
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            file.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int read = input.read(buffer); read > 0; read = input.read(buffer)) {
                    digest.update(buffer, 0, read)
                }
            }
            def actual = digest.digest().collect { String.format('%02x', it) }.join()
            if (actual != expected) throw new GradleException("Ci brand asset hash mismatch: ${name}")
        }
    }
}

tasks.register('prepareCiBrandAssets', Copy) {
    dependsOn tasks.named('verifyCiBrandAssets')
    from(rootProject.file('brand/ci-logo-master-transparent.png')) { rename { 'ci_logo.png' } }
    from(rootProject.file('brand/ci-logo-monochrome-white.png')) { rename { 'ci_notification.png' } }
    from(rootProject.file('brand/ci-icon-512.png')) { rename { 'ci_app_icon.png' } }
    into(layout.projectDirectory.dir('src/main/res/drawable'))
}

preBuild.dependsOn tasks.named('prepareCiBrandAssets')
