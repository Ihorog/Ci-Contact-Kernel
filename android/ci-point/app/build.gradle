plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.cimeika.cipoint'
    compileSdk 35

    defaultConfig {
        applicationId 'ua.cimeika.cipoint'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('prepareCiLogo', Copy) {
    from(rootProject.file('../../Cipole (2).png'))
    into(layout.projectDirectory.dir('src/main/res/drawable'))
    rename { 'ci_logo.png' }
}

preBuild.dependsOn tasks.named('prepareCiLogo')
