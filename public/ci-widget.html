<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071019">
  <title>Ci+ — контактне ядро</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #f5f7fb; color: #111; }
    .ci-logo {
      display: block;
      width: 64px;
      height: 64px;
      object-fit: contain;
      background: transparent;
      flex-shrink: 0;
    }
    .ci-logo-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    h1 { margin-top: 0; display: flex; align-items: center; }
    .grid { display: grid; gap: 1rem; grid-template-columns: 1fr 1fr; }
    .card { background: #fff; border: 1px solid #d7dfef; border-radius: 8px; padding: 1rem; }
    textarea { width: 100%; min-height: 90px; }
    button { padding: 0.5rem 1rem; }
    pre { white-space: pre-wrap; word-break: break-word; background: #0a1020; color: #d8ecff; padding: 0.75rem; border-radius: 6px; min-height: 80px; }
    .full { grid-column: 1 / -1; }
    label { display: inline-flex; margin-right: 1rem; gap: 0.3rem; align-items: center; }
  </style>
</head>
<body>
  <h1><span class="ci-logo-wrap"><img class="ci-logo" src="/ci-mark-dark.png" alt="Ci logo" />Ci Contact Widget</span></h1>
  <p>signal → classify → route → gate → execute/stub → verify → memory</p>
  <div class="grid">
    <section class="card full">
      <h2>Send Signal</h2>
      <textarea id="signalText" placeholder="Type a signal (e.g. deploy service, remember fact, task: implement)"></textarea>
      <div>
        <label><input type="checkbox" id="permRepoWrite" /> repo_write</label>
        <label><input type="checkbox" id="permDeploy" /> deploy</label>
        <label><input type="checkbox" id="permApiWrite" /> external_api_write</label>
        <label><input type="checkbox" id="permDevice" /> device_action</label>
        <label><input type="checkbox" id="permDestructive" /> destructive_action</label>
      </div>
      <button id="sendBtn">POST /ci/signal</button>
    </section>

    <section class="card"><h2>Current Signal</h2><pre id="signal"></pre></section>
    <section class="card"><h2>Classification</h2><pre id="classification"></pre></section>
    <section class="card"><h2>Routed Node</h2><pre id="node"></pre></section>
    <section class="card"><h2>Permission State</h2><pre id="permission"></pre></section>
    <section class="card"><h2>Execution Center</h2><pre id="center"></pre></section>
    <section class="card"><h2>Verification</h2><pre id="verification"></pre></section>
    <section class="card full"><h2>Memory Log (GET /ci/memory)</h2><pre id="memory"></pre></section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const launcher = $('launcher');
    const shell = $('shell');
    const form = $('signalForm');
    const input = $('signalText');
    const send = $('send');
    const errorBox = $('error');
    const historyKey = 'ci-plus-widget-history-v1';

    const domainRules = [
      ['Домівка', /дім|домів|квартир|світл|вода|газ|опален|роутер|orange|телевізор|пристрій|ремонт/i],
      ['Фінанси', /грош|оплат|рахунок|банк|ціна|бюджет|paypal|дохід|витрат/i],
      ['Проєкти й робота', /проєкт|робот|repo|git|deploy|сайт|код|api|задач/i],
      ['Дані й документи', /файл|документ|архів|дані|резерв|копі|пам'ят|збереж/i],
      ['Події та автоматизація', /поді|нагад|календар|автомат|заплан|монітор|коли/i],
      ['Особисте й сімейне', /сім'|марі|юл|здоров|подорож|настрій|особист/i]
    ];

    function detectDomain(text) {
      return domainRules.find(([, rule]) => rule.test(text))?.[0] || 'Ci+ · загальний контур';
    }

    function permissionOverrides() {
      return {
        localWrite: $('localWrite').checked,
        repoWrite: $('repoWrite').checked,
        externalApiWrite: $('externalApiWrite').checked,
        deployOrDeviceConfirm: $('deployConfirm').checked
      };
    }

    function openWidget() {
      shell.hidden = false;
      launcher.hidden = true;
      launcher.setAttribute('aria-expanded', 'true');
      requestAnimationFrame(() => input.focus());
      checkHealth();
    }

    function closeWidget() {
      shell.hidden = true;
      launcher.hidden = false;
      launcher.setAttribute('aria-expanded', 'false');
      launcher.focus();
    }

    function statusClass(status = '') {
      return String(status).toLowerCase().replace(/[^a-z]+/g, '-');
    }

    function renderTask(task, domain) {
      if (!task) return;
      $('result').hidden = false;
      $('status').textContent = task.status || 'UNKNOWN';
      $('status').className = `status ${statusClass(task.status)}`;
      $('domain').textContent = domain || task.payload?.context?.domain || '—';
      $('classification').textContent = task.classification || '—';
      $('route').textContent = [task.targetNode, task.executionCenter].filter(Boolean).join(' → ') || '—';
      $('permission').textContent = task.permissionDecision || '—';
      const verification = task.verification || {};
      const proof = [
        task.id ? `Ci-ID: ${task.id}` : null,
        verification.status ? `перевірка: ${verification.status}` : null,
        verification.method ? `метод: ${verification.method}` : null,
        task.nextSuggestedAction || null
      ].filter(Boolean).join(' · ');
      $('proof').textContent = proof || 'Доказ ще не отримано.';
    }

    function getHistory() {
      try { return JSON.parse(localStorage.getItem(historyKey) || '[]'); }
      catch { return []; }
    }

    function saveHistory(entry) {
      const next = [entry, ...getHistory().filter((item) => item.id !== entry.id)].slice(0, 8);
      localStorage.setItem(historyKey, JSON.stringify(next));
      renderHistory();
    }

    function renderHistory() {
      const items = getHistory();
      $('history').replaceChildren(...(items.length ? items.map((item) => {
        const row = document.createElement('div');
        row.className = 'history-item';
        const title = document.createElement('strong');
        title.textContent = item.text;
        const state = document.createElement('span');
        state.textContent = item.status;
        const meta = document.createElement('span');
        meta.textContent = `${item.domain} · ${new Date(item.at).toLocaleString('uk-UA')}`;
        row.append(title, state, meta);
        return row;
      }) : [Object.assign(document.createElement('span'), { textContent: 'Історія порожня.' })]));
    }

    async function requestJson(url, options) {
      const response = await fetch(url, options);
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
      return body;
    }

    async function settleTask(initialTask) {
      let task = initialTask;
      const transient = new Set(['CREATED', 'CLASSIFIED', 'ROUTED', 'WAITING_PERMISSION', 'QUEUED', 'RUNNING', 'VERIFYING']);
      for (let attempt = 0; attempt < 12 && transient.has(task.status); attempt += 1) {
        await new Promise((resolve) => setTimeout(resolve, 450));
        const data = await requestJson(`/ci/task/${encodeURIComponent(task.id)}`);
        task = data.task || task;
        renderTask(task, task.payload?.context?.domain);
      }
      return task;
    }

    async function checkHealth() {
      try {
        const status = await requestJson('/ci/status');
        $('healthDot').classList.toggle('online', Boolean(status.workerActive));
        $('healthText').textContent = status.workerActive ? `ядро активне · черга ${status.queueDepth || 0}` : 'ядро відповідає';
      } catch {
        $('healthDot').classList.remove('online');
        $('healthText').textContent = 'ядро недоступне';
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const domain = detectDomain(text);
      send.disabled = true;
      send.textContent = 'Передаю…';
      errorBox.hidden = true;
      try {
        const payload = {
          message: text,
          source: 'ci-plus-widget',
          permissionLevel: $('permissionLevel').value,
          permissions: permissionOverrides(),
          context: { domain, interface: 'single-icon-widget' }
        };
        const created = await requestJson('/ci/signal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        let task = created.task;
        renderTask(task, domain);

        if (task.status === 'BLOCKED' && Object.values(permissionOverrides()).some(Boolean)) {
          const rerun = await requestJson(`/ci/task/${encodeURIComponent(task.id)}/run`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ permissions: permissionOverrides() })
          });
          task = rerun.task || task;
        }

        task = await settleTask(task);
        renderTask(task, domain);
        saveHistory({ id: task.id, text, domain, status: task.status || 'UNKNOWN', at: new Date().toISOString() });
        checkHealth();
      } catch (error) {
        errorBox.textContent = `Не передано: ${error.message}`;
        errorBox.hidden = false;
      } finally {
        send.disabled = false;
        send.textContent = 'Передати в Ci';
      }
    });

    launcher.addEventListener('click', openWidget);
    $('close').addEventListener('click', closeWidget);
    shell.addEventListener('click', (event) => { if (event.target === shell) closeWidget(); });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && !shell.hidden) closeWidget(); });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'uk-UA';
      recognition.interimResults = false;
      recognition.addEventListener('start', () => $('voice').classList.add('listening'));
      recognition.addEventListener('end', () => $('voice').classList.remove('listening'));
      recognition.addEventListener('result', (event) => {
        input.value = event.results[0][0].transcript;
        input.focus();
      });
      $('voice').addEventListener('click', () => recognition.start());
    } else {
      $('voice').hidden = true;
    }

    renderHistory();
  </script>
</body>
</html>
